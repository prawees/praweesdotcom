<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Gallery | Prawee Sinweeruthai</title>
  <meta name="description" content="Film photographs by Prawee Sinweeruthai, grouped by mood, with the film stock named under each frame.">
  <link rel="icon" type="image/png" href="../assets/favicon.png">
  <link rel="preload" href="../assets/fonts/arimo-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../assets/base.css?v=9">
  <link rel="stylesheet" href="../assets/site.css?v=9">
  <style>
    /* ---------- title: still, no motion ---------- */
    .gh { padding-top: 32px; }
    .gh h1 { grid-column: 1 / -1; width: fit-content; max-width: 100%; font-size: clamp(26px, 5vw, 64px); font-weight: 400; line-height: 1.05; letter-spacing: -.04em; }
    @media (min-width: 768px) { .gh { padding-top: 56px; } }

    /* ---------- the flow: rows of photographs, edge to edge, a hair apart ----------
       Rows are filled so every photograph in a row has the same height; how many sit in a row depends on their shapes.
       Chapter keywords are set in dither, small, on alternating sides, between the rows. */
    .flow { position: relative; padding-top: 40px; min-height: 80vh; }
    .row { display: flex; gap: 3px; margin-bottom: 4px; align-items: flex-start; }
    @media (max-width: 599px) { .row { gap: 2px; } }
    .gallery-item { min-width: 0; display: block; }
    .gallery-img { width: 100%; height: auto; display: block; background: var(--light); cursor: zoom-in; }
    .gallery-meta { display: flex; justify-content: flex-end; line-height: 1; }
    .gallery-meta button { display: block; max-width: 100%; padding: 5px 1px 7px; font-size: 10px; line-height: 1; letter-spacing: .04em; color: var(--mid); opacity: .62; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: right; transition: opacity .2s; }
    .gallery-meta button:hover { opacity: 1; }
    @media (pointer: coarse) { .gallery-meta button { padding: 8px 1px 10px; } }
    .sw { display: inline-block; width: 5px; height: 5px; margin-left: 6px; vertical-align: 1px; }

    .lab { padding: 0 var(--padr) 0 var(--pad); margin: 72px auto 22px; max-width: none; }
    .lab.r { text-align: right; }
    html.night .lab h2 { background-image: var(--d8w); }
    .lab h2 { display: inline-block; font-size: clamp(34px, 7vw, 72px); font-weight: 700; line-height: 1; letter-spacing: -.04em; padding-bottom: .08em; opacity: .42;
      color: transparent; -webkit-text-fill-color: transparent; background-image: var(--d8); background-size: 4px 4px; -webkit-background-clip: text; background-clip: text; image-rendering: pixelated; }
    .lab:first-child { margin-top: 24px; }
    @media (min-width: 768px) { .lab { margin: 112px auto 30px; } .lab:first-child { margin-top: 32px; } }

    /* film filter header */
    .fbar { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 20px; padding: 0 var(--padr) 0 var(--pad); margin: 24px 0 28px; }
    .fbar h2 { font-size: var(--fs-h); font-weight: 400; letter-spacing: -.035em; line-height: 1.05; }
    .fbar button { font-size: var(--fs-s); color: var(--mid); text-decoration: underline; text-underline-offset: 3px; min-height: 40px; }
    .fbar .sw { width: 10px; height: 10px; margin: 0 10px 0 0; }

    .mk { position: absolute; left: 0; width: 1px; pointer-events: none; visibility: hidden; }


    /* ---------- chapter cloud: every chapter name, in mixed sizes and faces. Inline above the first chapter, and as a floating index. ---------- */
    .cloud { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 22px; margin-top: 36px; }
    .cloud a { text-decoration: none; color: var(--ink); line-height: 1.05; padding: 6px 0; white-space: nowrap; }
    .cloud a:hover, .cloud a[aria-current="true"] { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 5px; }
    .cloud a.c0 { font-family: Georgia, "Times New Roman", serif; font-style: italic; font-size: 1.1em; }
    .cloud a.c1 { font-weight: 700; font-size: 1.9em; letter-spacing: -.045em; }
    .cloud a.c2 { font-family: "Courier New", Menlo, monospace; font-size: .78em; letter-spacing: .2em; text-transform: uppercase; }
    .cloud a.c3 { font-size: 2.3em; letter-spacing: -.06em; font-weight: 400; }
    .cloud a.c4 { font-family: Georgia, "Times New Roman", serif; font-weight: 700; font-size: 1.45em; }
    .cloud a.c5 { font-weight: 700; font-size: .82em; letter-spacing: .32em; text-transform: uppercase; }
    .cloud a.c6 { font-size: 2em; font-weight: 700; letter-spacing: -.04em; color: transparent; -webkit-text-fill-color: transparent; -webkit-text-stroke: 1px var(--ink); }
    .cloud a.c7 { font-size: 1.6em; font-weight: 700; letter-spacing: -.04em; color: transparent; -webkit-text-fill-color: transparent; background-image: var(--d8); background-size: 4px 4px; -webkit-background-clip: text; background-clip: text; image-rendering: pixelated; }
    html.night .cloud a.c7 { background-image: var(--d8w); }
    .cloud { font-size: 17px; }
    @media (min-width: 768px) { .cloud { font-size: 22px; gap: 6px 34px; } .gh .cloud { max-width: 900px; } }
    .cloud-btn { position: fixed; right: max(12px, env(safe-area-inset-right)); bottom: max(14px, env(safe-area-inset-bottom)); z-index: 60; background: var(--paper); color: var(--ink); border: 1px solid var(--ink); padding: 0 14px; min-height: 40px; font-size: var(--fs-s); opacity: 0; visibility: hidden; transition: opacity .25s, visibility 0s .25s; }
    .cloud-btn.show { opacity: 1; visibility: visible; transition: opacity .25s; }
    .cloud.pop { position: fixed; right: max(12px, env(safe-area-inset-right)); bottom: calc(max(14px, env(safe-area-inset-bottom)) + 50px); z-index: 60; margin: 0; width: min(420px, calc(100vw - 24px)); max-height: 70vh; overflow-y: auto; background: var(--paper); border: 1px solid var(--ink); padding: 14px 18px 12px; font-size: 18px; gap: 2px 20px; }
    .cloud.pop[hidden] { display: none; }
    @media (prefers-reduced-motion: reduce) { .cloud-btn { transition: none; } }

    /* ---------- the end: the page dissolves to black, then the cameras, the film and instagram ---------- */
    .end { padding-top: 30vh; padding-top: 30svh; }
    .end .sec { padding-top: 40px; }
    @media (min-width: 768px) { .end .sec { padding-top: 56px; } }
    .end .hd { font-size: clamp(30px, 5.5vw, 56px); }
    .list { list-style: none; }
    .list li { border-top: 1px solid var(--light); }
    .list .row2 { display: flex; align-items: baseline; gap: 12px; width: 100%; padding: 11px 0; text-align: left; font-size: var(--fs-b); }
    .list .row2 .sw { width: 10px; height: 10px; margin: 0; vertical-align: baseline; align-self: center; flex: none; }
    .list .row2 .nm { flex: 1 1 auto; min-width: 0; }
    .list .row2 .hx { color: var(--mid); font-size: 12px; letter-spacing: .02em; font-variant-numeric: tabular-nums; text-transform: uppercase; }
    .list button.row2 { cursor: pointer; }
    .list button.row2:hover .nm { text-decoration: underline; text-underline-offset: 4px; }
    .list button.row2[aria-pressed="true"] .nm { font-weight: 700; }
    @media (min-width: 768px) { .list.two { columns: 2; column-gap: 32px; } .list.two li { break-inside: avoid; } }
    .ig { width: 100%; max-width: 540px; height: 600px; border: 0; display: block; background: #fff; }
    .ig-link { display: inline-block; margin-top: 14px; font-size: var(--fs-s); }
    .end .foot { padding-top: 96px; padding-bottom: max(88px, env(safe-area-inset-bottom)); }
    .end .quote { padding-top: 56px; }

    /* ---------- viewer ---------- */
    .lb { position: fixed; inset: 0; z-index: 8000; background: var(--paper); display: none; grid-template-rows: auto minmax(0, 1fr) auto; padding: max(12px, env(safe-area-inset-top)) 0 max(12px, env(safe-area-inset-bottom)); }
    .lb.open { display: grid; }
    .lb .top, .lb .cap { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 0 var(--pad, 16px); font-size: var(--fs-b); }
    .lb button { min-height: 44px; min-width: 44px; font-size: var(--fs-b); text-decoration: underline; text-underline-offset: 3px; }
    .lb .stage { display: grid; place-items: center; min-height: 0; padding: 8px var(--pad, 16px); touch-action: pan-y; }
    .lb img { max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; display: block; }
    .lb .cap span:first-child { font-weight: 700; }
    .lb .cap span:last-child { color: var(--mid); }
    .lb .nav2 { display: flex; gap: 4px; }
  </style>
</head>

  <!-- Viewer -->

    <div class="stage" id="lb-stage"><img id="lb-img" alt=""></div>
    <div class="cap"><span id="lb-film"></span><span id="lb-t"></span></div>
  </div>

  <script src="../assets/film/frames.js?v=10"></script>
  <script>
    /* Gallery. Photographs are laid out in rows that fill the width edge to edge, a few pixels apart.
       The rows are chosen so the photographs in each row come out at about the same height, whatever their shapes.
       Tapping the film name under a photograph, or in the list at the bottom, shows only that film. */
    (function () {
      var CHAPTERS = window.FILM_CHAPTERS || [];
      var FRAMES = ['../assets/film/ektar100-33.jpg', '../assets/film/ultramax-34.jpg', '../assets/film/ultramax-15.jpg', '../assets/film/lomo100-38.jpg'];
      var SW = { fujifilmc200: '#95DEBD', fujifilmsuperiaxtra400: '#27A65A', kodaktmax400: '#F9E273', kodakproimage100: '#F5A943', kodakgold200: '#F6E272', fuji100: '#85CD48', filmneverdieiro200: '#F6CA68', agfasoundst8d: '#EA3E21', kodakultramax400: '#3C83DE', lomo100: '#D0C3C0', myheart200: '#FA8BB2', fuji400: '#B6DE67', ultrafinextreme400: '#454545', ilfordpan400: '#EA3F20', kodakcolorplus200: '#EFC55D', filmneverdieiro400: '#FA92B0', fujif250teilo100: '#98C4E9', fujif250tei100: '#98C4E9', fujif400tei200: '#98C5E7', kodakektar100: '#CD7464' };

      var LANG = 'th';
      try { var sv = localStorage.getItem('prawees.lang'); if (sv === 'en' || sv === 'th') LANG = sv; } catch (e) {}
      function tr(th, en) { return LANG === 'th' ? th : en; }
      function norm(s) { return String(s).toLowerCase().replace(/[^a-z0-9]/g, ''); }
      function hexOf(key) { return SW[key] || '#E5E5E5'; }

      var flow = document.getElementById('flow'), rowsEl = document.getElementById('rows');
      var all = [], chapters = [], view = [], filter = null, markers = [];

      /* ---------- one photograph ---------- */
      function makeItem(it) {
        var item = document.createElement('div'); item.className = 'gallery-item';
        var img = document.createElement('img'); img.className = 'gallery-img';
        img.src = '../assets/film/' + it.f; img.width = it.w; img.height = it.h; img.loading = 'lazy'; img.decoding = 'async';
        img.alt = it.t ? it.t + ', ' + it.film : 'film photograph, ' + it.film;
        img.addEventListener('error', function () { item.style.display = 'none'; });
        img.addEventListener('click', function () { openViewer(it); });
        var meta = document.createElement('div'); meta.className = 'gallery-meta';
        var l = document.createElement('button'); l.type = 'button'; l.title = hexOf(it.key);
        var sw = document.createElement('i'); sw.className = 'sw'; sw.style.background = hexOf(it.key);
        l.appendChild(document.createTextNode(it.film)); l.appendChild(sw);
        l.addEventListener('click', function () { setFilter(it.key); });
        meta.appendChild(l);
        item.appendChild(img); item.appendChild(meta);
        it.el = item; it.ar = it.w / it.h;
        return item;
      }

      CHAPTERS.forEach(function (ch, ci) {
        var items = ch.items.map(function (raw) {
          var it = { f: raw.f, film: raw.film, t: raw.t, w: raw.w, h: raw.h, key: norm(raw.film), ch: ci };
          makeItem(it); all.push(it); return it;
        });
        chapters.push({ id: ch.id, note: ch.note, items: items, amb: FRAMES[ci % FRAMES.length] });
      });

      /* ambient markers: one invisible box per chapter, so the dithered background changes frame with the chapter */
      chapters.forEach(function (c) {
        var m = document.createElement('div'); m.className = 'mk'; m.setAttribute('data-amb', c.amb); m.setAttribute('aria-hidden', 'true');
        flow.appendChild(m); markers.push(m);
      });

      /* ---------- rows ----------
         Partition a chapter's photographs, in order, into rows. A row of k photographs with aspect ratios a1..ak
         across width W has height (W - gaps) / (a1 + .. + ak); the partition whose row heights stay closest to a
         target height wins (dynamic programming). The target wobbles a little from row to row so the page
         does not look machined. The last row may stop short of the edge rather than blow one photograph up. */
      function jit(n) { return ((Math.imul(n + 1, 2654435761) >>> 0) % 1000) / 1000; }
      function partition(list, W, gap, target, seed) {
        var n = list.length, best = [0], from = [0], capH = [], i, j;
        for (i = 1; i <= n; i++) {
          best[i] = 1e18;
          var sum = 0;
          for (j = i - 1; j >= 0 && i - j <= 5; j--) {
            sum += list[j].ar;
            var k = i - j, h = (W - gap * (k - 1)) / sum, tg = target * (0.88 + 0.24 * jit(seed + j)), c, hh = h;
            if (i === n && h > tg * 1.3) { hh = tg * 1.3; c = (hh - tg) * (hh - tg) * 1.5; }
            else c = (h - tg) * (h - tg);
            if (k === 1 && h > target * 1.45 && i !== n) c *= 2;     // a lone enlarged photograph is rarely wanted mid-chapter
            if (best[j] + c < best[i]) { best[i] = best[j] + c; from[i] = j; capH[i] = hh / h; }
          }
        }
        var rows = [];
        for (i = n; i > 0; i = from[i]) rows.unshift({ items: list.slice(from[i], i), fill: i === n ? Math.min(1, capH[i]) : 1 });
        return rows;
      }

      function emitRows(host, list, W, gap, target, seed) {
        partition(list, W, gap, target, seed).forEach(function (r) {
          var row = document.createElement('div'); row.className = 'row';
          if (r.fill < 0.999) row.style.width = (r.fill * 100).toFixed(2) + '%';
          r.items.forEach(function (it) { it.el.style.flex = it.ar.toFixed(4) + ' 1 0%'; row.appendChild(it.el); });
          host.appendChild(row);
        });
      }

      function layout() {
        var W = flow.clientWidth || window.innerWidth, gap = W < 600 ? 2 : 3;
        var target = W < 600 ? 270 : W < 1000 ? 340 : Math.min(470, W * 0.29);
        rowsEl.innerHTML = '';
        var old = flow.querySelector('.fbar'); if (old) old.remove();
        view = [];
        var labels = [];
        if (filter) {
          var items = all.filter(function (it) { return it.key === filter; });
          var bar = document.createElement('div'); bar.className = 'fbar';
          var h = document.createElement('h2');
          var sw = document.createElement('i'); sw.className = 'sw'; sw.style.background = hexOf(filter);
          h.appendChild(sw); h.appendChild(document.createTextNode(items.length ? items[0].film : ''));
          var b = document.createElement('button'); b.type = 'button'; b.textContent = tr('ดูทั้งหมด', 'show all');
          b.addEventListener('click', function () { setFilter(null); });
          bar.appendChild(h); bar.appendChild(b);
          flow.insertBefore(bar, rowsEl);
          emitRows(rowsEl, items, W, gap, target, 7);
          items.forEach(function (it) { view.push(it); });
        } else {
          chapters.forEach(function (c, ci) {
            var lab = document.createElement('div'); lab.className = 'lab' + (ci % 2 ? ' r' : ''); lab.id = c.id;
            lab.innerHTML = '<h2></h2>';
            lab.querySelector('h2').textContent = c.id;
            rowsEl.appendChild(lab); labels.push(lab);
            emitRows(rowsEl, c.items, W, gap, target, ci * 37);
            c.items.forEach(function (it) { view.push(it); });
          });
        }
        cloud.style.display = filter ? 'none' : '';
        if (typeof schedCloud === 'function') schedCloud();
        placeMarkers(labels);
      }

      function placeMarkers(labels) {
        var top = flow.getBoundingClientRect().top + window.pageYOffset, H = flow.offsetHeight;
        if (labels.length === markers.length) {
          var ys = labels.map(function (l) { return l.getBoundingClientRect().top + window.pageYOffset - top; });
          markers.forEach(function (m, i) { var y = ys[i], e = i + 1 < ys.length ? ys[i + 1] : H; m.style.top = Math.max(0, y) + 'px'; m.style.height = Math.max(1, e - y) + 'px'; });
        } else {
          markers.forEach(function (m, i) { m.style.top = (H * i / markers.length) + 'px'; m.style.height = (H / markers.length) + 'px'; });
        }
      }

      function setFilter(key) {
        filter = key || null;
        layout();
        buildFilmList();
        var y = Math.max(0, flow.getBoundingClientRect().top + window.pageYOffset - 88);
        try { window.scrollTo({ top: y, left: 0, behavior: 'instant' }); } catch (e) { window.scrollTo(0, y); }
      }

      /* ---------- viewer ---------- */
      var lb = document.getElementById('lb'), lbImg = document.getElementById('lb-img');
      var cur = 0, opener = null;
      function setViewer(i) {
        cur = (i + view.length) % view.length; var it = view[cur];
        lbImg.src = '../assets/film/' + it.f; lbImg.alt = it.t ? it.t + ', ' + it.film : it.film;
        document.getElementById('lb-film').textContent = it.film;
        document.getElementById('lb-t').textContent = it.t || '';
      }
      function openViewer(it) { opener = document.activeElement; setViewer(view.indexOf(it)); lb.classList.add('open'); document.body.style.overflow = 'hidden'; document.getElementById('lb-close').focus(); }
      function closeViewer() { lb.classList.remove('open'); document.body.style.overflow = ''; if (opener && opener.focus) { try { opener.focus(); } catch (e) {} } }
      document.getElementById('lb-close').addEventListener('click', closeViewer);
      document.getElementById('lb-prev').addEventListener('click', function () { setViewer(cur - 1); });
      document.getElementById('lb-next').addEventListener('click', function () { setViewer(cur + 1); });
      var sx = null, stage = document.getElementById('lb-stage');
      stage.addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; }, { passive: true });
      stage.addEventListener('touchend', function (e) { if (sx === null) return; var dx = e.changedTouches[0].clientX - sx; sx = null; if (Math.abs(dx) > 50) setViewer(cur + (dx < 0 ? 1 : -1)); }, { passive: true });
      document.addEventListener('keydown', function (e) {
        if (!lb.classList.contains('open')) return;
        if (e.key === 'Escape') closeViewer(); else if (e.key === 'ArrowRight') setViewer(cur + 1); else if (e.key === 'ArrowLeft') setViewer(cur - 1);
      });

      /* ---------- the film list at the bottom: swatch, name, hex; tap to show only that film ---------- */
      function buildFilmList() {
        var ul = document.getElementById('film-list'); ul.innerHTML = '';
        var m = {}; all.forEach(function (it) { (m[it.key] = m[it.key] || { name: it.film, n: 0 }).n++; });
        Object.keys(m).map(function (k) { return { key: k, name: m[k].name, n: m[k].n }; })
          .sort(function (a, b) { return b.n - a.n || (a.name < b.name ? -1 : 1); })
          .forEach(function (f) {
            var li = document.createElement('li'), b = document.createElement('button');
            b.type = 'button'; b.className = 'row2'; b.setAttribute('aria-pressed', filter === f.key ? 'true' : 'false');
            var sw = document.createElement('i'); sw.className = 'sw'; sw.style.background = hexOf(f.key);
            var nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = f.name;
            var hx = document.createElement('span'); hx.className = 'hx'; hx.textContent = hexOf(f.key);
            b.appendChild(sw); b.appendChild(nm); b.appendChild(hx);
            b.addEventListener('click', function () { setFilter(filter === f.key ? null : f.key); });
            li.appendChild(b); ul.appendChild(li);
          });
      }


      /* ---------- chapter cloud and floating index ---------- */
      var cloud = document.getElementById('cloud'), pop = document.getElementById('cloud-pop'), cbtn = document.getElementById('cloud-btn');
      var ORDER = [3, 1, 6, 0, 7, 4, 2, 5];                    // which face each chapter wears, so neighbours never match
      function fillCloud(host) {
        host.innerHTML = '';
        chapters.forEach(function (c, ci) {
          var a = document.createElement('a'); a.href = '#' + c.id; a.textContent = c.id; a.className = 'c' + ORDER[ci % ORDER.length]; a.setAttribute('data-ch', c.id);
          if (ci % 3 === 1) a.style.alignSelf = 'center'; else if (ci % 3 === 2) a.style.alignSelf = 'flex-end';
          a.addEventListener('click', function (e) {
            e.preventDefault();
            var el = document.getElementById(c.id); if (!el) return;
            var y = Math.max(0, el.getBoundingClientRect().top + window.pageYOffset - 84);
            var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            try { window.scrollTo({ top: y, left: 0, behavior: reduce ? 'instant' : 'smooth' }); } catch (er) { window.scrollTo(0, y); }
            closePop();
          });
          host.appendChild(a);
        });
      }
      function closePop() { pop.hidden = true; cbtn.setAttribute('aria-expanded', 'false'); }
      cbtn.addEventListener('click', function () { var open = pop.hidden; pop.hidden = !open; cbtn.setAttribute('aria-expanded', open ? 'true' : 'false'); });
      document.addEventListener('click', function (e) { if (!pop.hidden && !pop.contains(e.target) && e.target !== cbtn) closePop(); });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !pop.hidden) closePop(); });
      var cq = false;
      function cloudState() {
        cq = false;
        var inline = cloud.getBoundingClientRect();
        var show = !filter && inline.bottom < 40;
        cbtn.classList.toggle('show', show);
        if (!show && !pop.hidden) closePop();
        if (show) {                                              // mark the chapter being read
          var cur = null;
          rowsEl.querySelectorAll('.lab').forEach(function (l) { if (l.getBoundingClientRect().top < window.innerHeight * 0.5) cur = l.id; });
          pop.querySelectorAll('a').forEach(function (a) { a.setAttribute('aria-current', a.getAttribute('data-ch') === cur ? 'true' : 'false'); });
        }
      }
      function schedCloud() { if (!cq) { cq = true; (window.requestAnimationFrame || setTimeout)(cloudState); } }
      window.addEventListener('scroll', schedCloud, { passive: true }); window.addEventListener('resize', schedCloud);
      fillCloud(cloud); fillCloud(pop);

      /* ---------- instagram: loads only when the bottom of the page is near ---------- */
      var igBody = document.getElementById('ig-body'), igDone = false;
      function loadIg() {
        if (igDone) return; igDone = true;
        var f = document.createElement('iframe'); f.className = 'ig'; f.title = 'prawee.sin on instagram'; f.setAttribute('scrolling', 'no'); f.setAttribute('loading', 'lazy');
        f.src = 'https://www.instagram.com/prawee.sin/embed';
        igBody.insertBefore(f, igBody.firstChild);
      }
      if ('IntersectionObserver' in window) {
        var igo = new IntersectionObserver(function (es) { if (es[0].isIntersecting) { igo.disconnect(); loadIg(); } }, { rootMargin: '700px 0px' });
        igo.observe(igBody);
      } else window.addEventListener('load', loadIg);

      /* ---------- language ---------- */
      window.setLang = function (lang) {
        LANG = lang === 'en' ? 'en' : 'th';
        try { localStorage.setItem('prawees.lang', LANG); } catch (e) {}
        document.documentElement.lang = LANG;
        document.querySelectorAll('.btn-th').forEach(function (el) { el.classList.toggle('active', LANG === 'th'); });
        document.querySelectorAll('.btn-en').forEach(function (el) { el.classList.toggle('active', LANG === 'en'); });
        document.querySelectorAll('[data-th]').forEach(function (el) { var v = el.getAttribute(LANG === 'th' ? 'data-th' : 'data-en'); if (v !== null) el.textContent = v; });
        document.getElementById('lb-prev').setAttribute('aria-label', tr('ก่อนหน้า', 'previous'));
        document.getElementById('lb-next').setAttribute('aria-label', tr('ถัดไป', 'next'));
        layout();
      };

      buildFilmList();
      window.setLang(LANG);
      var rt, lastW = window.innerWidth;
      window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(function () { if (Math.abs(window.innerWidth - lastW) > 2) { lastW = window.innerWidth; layout(); } else placeMarkers(filter ? [] : [].slice.call(rowsEl.querySelectorAll('.lab'))); }, 180); });
      window.addEventListener('load', function () { layout(); });
      window.addEventListener('orientationchange', function () { setTimeout(function () { lastW = window.innerWidth; layout(); }, 300); });
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { layout(); });
    })();
  </script>
  <script src="../assets/dither.js?v=9"></script>
</body>
